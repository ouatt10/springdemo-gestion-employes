<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un employé</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h2 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #95a5a6;
        }
        
        .btn-secondary:hover {
            background: #7f8c8d;
        }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>➕ Ajouter un employé</h2>
        
        <div id="message" class="message"></div>

        <form id="formEmploye">
            <div class="form-group">
                <label for="matricule">Matricule :</label>
                <input type="number" id="matricule" required>
            </div>

            <div class="form-group">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" required>
            </div>

            <button type="submit" class="btn">Ajouter l'employé</button>
            <a href="/admin.html" class="btn btn-secondary" style="text-align: center; text-decoration: none; display: block;">Retour à l'administration</a>
        </form>
    </div>

    <script>
        document.getElementById("formEmploye").addEventListener("submit", function(e) {
            e.preventDefault();

            const employe = {
                matricule: parseInt(document.getElementById("matricule").value),
                nom: document.getElementById("nom").value.trim()
            };

            // URL RELATIVE (pas de hardcode)
            fetch("/employes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(employe)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erreur lors de l\'ajout');
                }
                return response.json();
            })
            .then(data => {
                showMessage("Employé ajouté avec succès !", "success");
                // Réinitialiser le formulaire
                document.getElementById("formEmploye").reset();
                
                // Rediriger après 2 secondes
                setTimeout(() => {
                    window.location.href = "/admin.html";
                }, 2000);
            })
            .catch(error => {
                showMessage("Erreur lors de l'ajout : " + error.message, "error");
            });
        });
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
