<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un employé</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h2 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #95a5a6;
            color: white;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        
        .btn-secondary:hover {
            background: #7f8c8d;
        }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .checkbox-group {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .checkbox-item {
            margin-bottom: 10px;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }
        
        .checkbox-item label {
            display: inline;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>➕ Ajouter un employé</h2>
        
        <div id="message" class="message"></div>

        <form id="formEmploye">
            <div class="form-group">
                <label for="nom">Nom *</label>
                <input type="text" id="nom" required>
            </div>

            <div class="form-group">
                <label for="prenom">Prénom *</label>
                <input type="text" id="prenom" required>
            </div>

            <div class="form-group">
                <label for="fonction">Fonction *</label>
                <input type="text" id="fonction" required>
            </div>

            <div class="form-group">
                <label for="entreprise">Entreprise (optionnel)</label>
                <select id="entreprise">
                    <option value="">-- Aucune --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Départements (optionnel)</label>
                <div class="checkbox-group" id="departementsCheckboxes">
                    <p style="color: #95a5a6; text-align: center;">Chargement...</p>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Ajouter l'employé</button>
            <a href="/admin.html" class="btn btn-secondary">Retour à l'administration</a>
        </form>
    </div>

    <script>
        // Charger les entreprises et départements au démarrage
        window.onload = function() {
            loadEntreprises();
            loadDepartements();
        };

        async function loadEntreprises() {
            try {
                const response = await fetch('/entreprises');
                const entreprises = await response.json();
                
                const select = document.getElementById('entreprise');
                entreprises.forEach(ent => {
                    const option = document.createElement('option');
                    option.value = ent.id;
                    option.textContent = ent.nom;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Erreur chargement entreprises:', error);
            }
        }

        async function loadDepartements() {
            try {
                const response = await fetch('/departements');
                const departements = await response.json();
                
                const container = document.getElementById('departementsCheckboxes');
                container.innerHTML = '';
                
                if (departements.length === 0) {
                    container.innerHTML = '<p style="color: #95a5a6; text-align: center;">Aucun département disponible</p>';
                } else {
                    departements.forEach(dep => {
                        const div = document.createElement('div');
                        div.className = 'checkbox-item';
                        div.innerHTML = `
                            <input type="checkbox" id="dep_${dep.id}" value="${dep.id}">
                            <label for="dep_${dep.id}">${dep.nom}</label>
                        `;
                        container.appendChild(div);
                    });
                }
            } catch (error) {
                console.error('Erreur chargement départements:', error);
            }
        }

        document.getElementById("formEmploye").addEventListener("submit", async function(e) {
            e.preventDefault();

            // Récupérer les départements sélectionnés
            const departementIds = Array.from(document.querySelectorAll('#departementsCheckboxes input[type="checkbox"]:checked'))
                .map(cb => parseInt(cb.value));

            const employe = {
                nom: document.getElementById("nom").value.trim(),
                prenom: document.getElementById("prenom").value.trim(),
                fonction: document.getElementById("fonction").value.trim(),
                entreprise: null,
                departements: []
            };

            // Ajouter l'entreprise si sélectionnée
            const entrepriseId = document.getElementById("entreprise").value;
            if (entrepriseId) {
                employe.entreprise = { id: parseInt(entrepriseId) };
            }

            // Ajouter les départements
            if (departementIds.length > 0) {
                employe.departements = departementIds.map(id => ({ id: id }));
            }

            try {
                const response = await fetch("/employes", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(employe)
                });

                if (!response.ok) {
                    throw new Error('Erreur lors de l\'ajout');
                }

                const data = await response.json();
                showMessage("✅ Employé ajouté avec succès !", "success");
                
                // Réinitialiser le formulaire
                document.getElementById("formEmploye").reset();
                
                // Rediriger après 2 secondes
                setTimeout(() => {
                    window.location.href = "/admin.html";
                }, 2000);
                
            } catch (error) {
                showMessage("❌ Erreur lors de l'ajout : " + error.message, "error");
            }
        });
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
