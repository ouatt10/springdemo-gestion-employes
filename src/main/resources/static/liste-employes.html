<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Liste des employés</title>
</head>
<body>

<h2>Liste des employés</h2>

<button onclick="chargerEmployes()">Afficher les employés</button>

<table border="1" id="tableEmployes">
    <thead>
        <tr>
            <th>Matricule</th>
            <th>Nom</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<br>
<a href="/ajouter-employe.html">Ajouter un employé</a>

<script>
function chargerEmployes() {
    fetch('/employes')
        .then(response => response.json())
        .then(data => {
            const tbody = document.querySelector("#tableEmployes tbody");
            tbody.innerHTML = "";

            data.forEach(emp => {
                const row = `
                    <tr>
                        <td>${emp.matricule}</td>
                        <td>${emp.nom}</td>
                        <td>
                            <button onclick="supprimer(${emp.matricule})">
                                Supprimer
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        });
}

function supprimer(id) {
    fetch('/employes/' + id, {
        method: 'DELETE'
    })
    .then(() => {
        chargerEmployes();
    });
}
</script>

</body>
</html>
