<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Gestion Employés</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #667eea;
        }
        
        .user-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .badge {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .actions {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        .btn-warning {
            background: #f39c12;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
        }
        
        .btn-warning:hover {
            background: #d68910;
        }
        
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #7f8c8d;
        }
        
        .employes-list {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
            font-size: 14px;
        }
        
        th {
            background: #667eea;
            color: white;
            position: sticky;
            top: 0;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #667eea;
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        
        .tag {
            display: inline-block;
            background: #e3f2fd;
            color: #1976d2;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin: 2px;
        }
        
        .tag.dept {
            background: #f3e5f5;
            color: #7b1fa2;
        }
        
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-content h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #2c3e50;
            font-weight: 500;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .checkbox-group {
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .checkbox-item {
            margin-bottom: 8px;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }
        
        .checkbox-item label {
            display: inline;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Administration - Gestion Employés</h1>
            <div class="user-info">
                <span class="badge">👤 Admin</span>
                <form action="/logout" method="post" style="margin: 0;">
                    <button type="submit" class="btn btn-secondary">Déconnexion</button>
                </form>
            </div>
        </div>
        
        <div id="message" class="message"></div>
        
        <div class="actions">
            <a href="/ajouter-employe.html" class="btn btn-primary">➕ Ajouter un employé</a>
            <a href="/gestion-entreprises.html" class="btn btn-primary" style="background: #9b59b6;">🏢 Gérer les entreprises</a>
            <a href="/gestion-departements.html" class="btn btn-primary" style="background: #3498db;">📁 Gérer les départements</a>
            <button onclick="loadEmployes()" class="btn btn-secondary">🔄 Actualiser</button>
        </div>
        
        <div class="employes-list">
            <h2 style="margin-bottom: 20px; color: #2c3e50;">📋 Liste des employés</h2>
            <div id="loading" class="loading">Chargement des employés...</div>
            <div id="tableContainer" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Matricule</th>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Fonction</th>
                            <th>Entreprise</th>
                            <th>Départements</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employesList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Modification -->
    <div id="modalEdit" class="modal">
        <div class="modal-content">
            <h2>✏️ Modifier l'employé</h2>
            <form id="editForm">
                <input type="hidden" id="editMatricule">
                
                <div class="form-group">
                    <label for="editNom">Nom *</label>
                    <input type="text" id="editNom" required>
                </div>
                
                <div class="form-group">
                    <label for="editPrenom">Prénom *</label>
                    <input type="text" id="editPrenom" required>
                </div>
                
                <div class="form-group">
                    <label for="editFonction">Fonction *</label>
                    <input type="text" id="editFonction" required>
                </div>
                
                <div class="form-group">
                    <label for="editEntreprise">Entreprise</label>
                    <select id="editEntreprise">
                        <option value="">-- Aucune --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Départements</label>
                    <div class="checkbox-group" id="editDepartements"></div>
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">💾 Enregistrer</button>
                    <button type="button" onclick="closeModal()" class="btn btn-secondary">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allEntreprises = [];
        let allDepartements = [];

        window.onload = function() {
            loadReferenceData();
            loadEmployes();
        };

        async function loadReferenceData() {
            try {
                const [entreprisesRes, departementsRes] = await Promise.all([
                    fetch('/entreprises'),
                    fetch('/departements')
                ]);
                allEntreprises = await entreprisesRes.json();
                allDepartements = await departementsRes.json();
            } catch (error) {
                console.error('Erreur chargement données référence:', error);
            }
        }

        async function loadEmployes() {
            const loading = document.getElementById('loading');
            const tableContainer = document.getElementById('tableContainer');
            const tbody = document.getElementById('employesList');
            
            loading.style.display = 'block';
            tableContainer.style.display = 'none';
            
            try {
                const response = await fetch('/employes');
                
                if (!response.ok) {
                    throw new Error('Erreur lors du chargement');
                }
                
                const employes = await response.json();
                tbody.innerHTML = '';
                
                if (employes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: #95a5a6;">Aucun employé trouvé</td></tr>';
                } else {
                    employes.forEach(emp => {
                        const entrepriseNom = emp.entreprise ? emp.entreprise.nom : '<em>Aucune</em>';
                        const departements = emp.departements && emp.departements.length > 0
                            ? emp.departements.map(d => `<span class="tag dept">${d.nom}</span>`).join('')
                            : '<em>Aucun</em>';
                        
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><strong>${emp.matricule}</strong></td>
                            <td>${emp.nom || ''}</td>
                            <td>${emp.prenom || ''}</td>
                            <td>${emp.fonction || ''}</td>
                            <td>${entrepriseNom}</td>
                            <td>${departements}</td>
                            <td>
                                <div class="action-buttons">
                                    <button onclick="openEditModal(${emp.matricule})" class="btn btn-warning">✏️</button>
                                    <button onclick="supprimerEmploye(${emp.matricule})" class="btn btn-danger">🗑️</button>
                                </div>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                }
                
                loading.style.display = 'none';
                tableContainer.style.display = 'block';
                
            } catch (error) {
                showMessage('Erreur lors du chargement des employés : ' + error.message, 'error');
                loading.style.display = 'none';
            }
        }

        async function openEditModal(matricule) {
            try {
                // Charger les données de l'employé
                const response = await fetch(`/employes/${matricule}`);
                const employe = await response.json();
                
                // Remplir le formulaire
                document.getElementById('editMatricule').value = employe.matricule;
                document.getElementById('editNom').value = employe.nom || '';
                document.getElementById('editPrenom').value = employe.prenom || '';
                document.getElementById('editFonction').value = employe.fonction || '';
                
                // Remplir le select des entreprises
                const selectEntreprise = document.getElementById('editEntreprise');
                selectEntreprise.innerHTML = '<option value="">-- Aucune --</option>';
                allEntreprises.forEach(ent => {
                    const option = document.createElement('option');
                    option.value = ent.id;
                    option.textContent = ent.nom;
                    if (employe.entreprise && employe.entreprise.id === ent.id) {
                        option.selected = true;
                    }
                    selectEntreprise.appendChild(option);
                });
                
                // Remplir les checkboxes des départements
                const divDept = document.getElementById('editDepartements');
                divDept.innerHTML = '';
                allDepartements.forEach(dept => {
                    const checked = employe.departements && employe.departements.some(d => d.id === dept.id);
                    divDept.innerHTML += `
                        <div class="checkbox-item">
                            <input type="checkbox" id="dept_${dept.id}" value="${dept.id}" ${checked ? 'checked' : ''}>
                            <label for="dept_${dept.id}">${dept.nom}</label>
                        </div>
                    `;
                });
                
                document.getElementById('modalEdit').style.display = 'block';
            } catch (error) {
                showMessage('Erreur : ' + error.message, 'error');
            }
        }

        function closeModal() {
            document.getElementById('modalEdit').style.display = 'none';
        }

        document.getElementById('editForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const matricule = document.getElementById('editMatricule').value;
            const departementIds = Array.from(document.querySelectorAll('#editDepartements input:checked'))
                .map(cb => parseInt(cb.value));
            
            const employe = {
                nom: document.getElementById('editNom').value.trim(),
                prenom: document.getElementById('editPrenom').value.trim(),
                fonction: document.getElementById('editFonction').value.trim(),
                entreprise: null,
                departements: []
            };
            
            const entrepriseId = document.getElementById('editEntreprise').value;
            if (entrepriseId) {
                employe.entreprise = { id: parseInt(entrepriseId) };
            }
            
            if (departementIds.length > 0) {
                employe.departements = departementIds.map(id => ({ id: id }));
            }
            
            try {
                const response = await fetch(`/employes/${matricule}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(employe)
                });
                
                if (!response.ok) throw new Error('Erreur lors de la modification');
                
                showMessage('✅ Employé modifié avec succès !', 'success');
                closeModal();
                loadEmployes();
            } catch (error) {
                showMessage('❌ Erreur : ' + error.message, 'error');
            }
        });

        async function supprimerEmploye(matricule) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer cet employé ?')) return;
            
            try {
                const response = await fetch(`/employes/${matricule}`, { method: 'DELETE' });
                
                if (!response.ok) throw new Error('Erreur lors de la suppression');
                
                showMessage('✅ Employé supprimé avec succès !', 'success');
                loadEmployes();
            } catch (error) {
                showMessage('❌ Erreur : ' + error.message, 'error');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 4000);
        }

        window.onclick = function(event) {
            const modal = document.getElementById('modalEdit');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
